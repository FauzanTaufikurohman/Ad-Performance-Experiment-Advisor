name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: advisora_ci
          POSTGRES_USER: advisora
          POSTGRES_PASSWORD: advisora-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisora -d advisora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://advisora:advisora-ci-only@localhost:5432/advisora_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://advisora:advisora-ci-only@localhost:5432/advisora_ci?sslmode=disable
      AUTH_SECRET: ci-only-secret-value-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check Go formatting
        working-directory: .
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Run backend tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Validate migrations on a blank database
        run: go run ./cmd/migrate
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
      - name: Scan production dependencies
        run: npm audit --omit=dev --audit-level=high
